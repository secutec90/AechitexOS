    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
  }

  /* Chips de BAPyC detectadas */
  #wrapChipsBAPyCGrupo {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
  }
  #wrapChipsBAPyCGrupo > span,
  .nem-chip-bapyc {
    display: inline-block;
    background: #ffffff;
    border: 1px solid #fcd34d;
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 10.5px;
    font-weight: 600;
    color: #92400e;
    line-height: 1.4;
  }

  /* Campo de ajustes razonables */
  #planAjustesRazonables {
    border: 1px solid #fcd34d;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.5;
    color: #334155;
    background: #ffffff;
    box-sizing: border-box;
  }
  #planAjustesRazonables:focus {
    outline: none;
    border-color: #f59e0b;
    box-shadow: 0 0 0 3px rgba(245, 158, 11, .18);
  }

  /* ============================================================
     FASE 3 — Botones de navegación inferior
     ============================================================ */
  .nem-step-nav-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding-top: 16px;
    margin-top: 22px;
    border-top: 1px solid #e2e8f0;
  }

  .nem-btn-accion {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    font-size: 12.5px;
    font-weight: 700;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    color: #334155;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .nem-btn-accion:hover { background: #f1f5f9; border-color: #94a3b8; }

  /* Primario: color plano, sin degradado ni sombra */
  .nem-btn-accion.nem-btn-primario {
    background: #0284c7;
    border-color: #0284c7;
    color: #ffffff;
    box-shadow: none;
  }
  .nem-btn-accion.nem-btn-primario:hover {
    background: #0369a1;
    border-color: #0369a1;
  }

  .nem-btn-accion:focus-visible,
  .nem-btn-accion.nem-btn-primario:focus-visible {
    outline: 2px solid #0284c7;
    outline-offset: 2px;
  }

  .nem-btn-accion:disabled,
  .nem-btn-accion[disabled] {
    background: #f1f5f9;
    border-color: #e2e8f0;
    color: #94a3b8;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ============================================================
     FASE 4 — Pestañas de sesiones didácticas
     ============================================================ */
  .nem-sesiones-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0 0 14px;
  }

  .nem-tab-sesion {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    color: #334155;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .nem-tab-sesion:hover { background: #f1f5f9; border-color: #94a3b8; }

  .nem-tab-sesion.activa {
    background: #0284c7;
    border-color: #0284c7;
    color: #ffffff;
  }

  .nem-tab-sesion.aprobada { border-color: #86efac; color: #15803d; background: #f0fdf4; }
  .nem-tab-sesion.borrador { border-style: dashed; color: #64748b; }

  .nem-tab-sesion.activa.aprobada,
  .nem-tab-sesion.activa.borrador {
    background: #0284c7;
    border-color: #0284c7;
    border-style: solid;
    color: #ffffff;
  }

  .nem-tab-sesion:focus-visible {
    outline: 2px solid #0284c7;
    outline-offset: 2px;
  }

  /* ============================================================
     FASE 4 — Barra de iDevices modulares
     ============================================================ */
  .idevice-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 10px;
    margin: 0 0 12px;
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    border-radius: 10px;
  }

  .idevice-bar > span {
    font-size: 10.5px !important;
    font-weight: 800 !important;
    color: #64748b !important;
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-right: 2px;
  }

  .idevice-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    color: #334155;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .idevice-btn:hover { background: #eff6ff; border-color: #93c5fd; }
  .idevice-btn:active { background: #dbeafe; }
  .idevice-btn:focus-visible { outline: 2px solid #0284c7; outline-offset: 2px; }

  /* Variantes semánticas (requieren la clase en el marcado) */
  .idevice-btn--lectura  { border-color: #a5b4fc; color: #4338ca; }
  .idevice-btn--lectura:hover  { background: #eef2ff; border-color: #818cf8; }

  .idevice-btn--pregunta { border-color: #fcd34d; color: #b45309; }
  .idevice-btn--pregunta:hover { background: #fffbeb; border-color: #f59e0b; }

  .idevice-btn--reto     { border-color: #86efac; color: #15803d; }
  .idevice-btn--reto:hover     { background: #f0fdf4; border-color: #4ade80; }

  /* ============================================================
     FASE 4 — Botón azul del encabezado de sesión
     ============================================================ */
  .nem-btn-accion--azul {
    background: #ffffff;
    border-color: #3b82f6 !important;
    color: #1d4ed8 !important;
  }
  .nem-btn-accion--azul:hover {
    background: #eff6ff !important;
    border-color: #2563eb !important;
  }

  /* ============================================================
     FASE 7 · MÓDULOS 2, 3 y 4 — BIBLIOTECA, CECSE, PREVIEW, IFRAME,
     LÍNEA DEL TIEMPO Y MODAL DE AYUDA PEDAGÓGICA
     DeepSeek · Selectores del contrato: #modalAyudaNEM,
     #vistaBibliotecaDocente, #buscarRecursoBiblioteca,
     #gridLibrosOficialesSEP, .card-recurso, .badge-cecse,
     #modalPreviewAlumno, .bloque-iframe-container, #timelineProyectoNEM.
     ============================================================ */

  /* ---------- 1 · Modal pedagógico NEM ---------- */
  #modalAyudaNEM {
    position: fixed;
    inset: 0;
    z-index: 99980;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(15, 23, 42, 0.45);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s ease;
  }
  #modalAyudaNEM.visible,
  #modalAyudaNEM.abierto { opacity: 1; pointer-events: auto; }

  #modalAyudaNEM .ayuda-nem-panel {
    width: min(660px, 96vw);
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 24px 60px rgba(15, 23, 42, 0.32);
    transform: translateY(10px) scale(.99);
    transition: transform .18s cubic-bezier(.2, .8, .2, 1);
  }
  #modalAyudaNEM.visible .ayuda-nem-panel,
  #modalAyudaNEM.abierto .ayuda-nem-panel { transform: none; }

  .ayuda-nem-cabecera {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px 18px;
    background: linear-gradient(135deg, #1e40af 0%, #2563eb 58%, #0ea5e9 100%);
    color: #ffffff;
    flex: 0 0 auto;
  }
  .ayuda-nem-icono {
    width: 40px;
    height: 40px;
    min-width: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.34);
    font-size: 20px;
    line-height: 1;
  }
  #modalAyudaTitulo {
    margin: 0;
    font-size: 15.5px;
    font-weight: 800;
    line-height: 1.3;
    color: #ffffff;
  }
  .ayuda-nem-ceja {
    margin: 2px 0 0;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.84);
  }
  .ayuda-nem-cerrar {
    margin-left: auto;
    width: 32px;
    height: 32px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.34);
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.14);
    color: #ffffff;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .ayuda-nem-cerrar:hover { background: rgba(255, 255, 255, 0.26); }
  .ayuda-nem-cerrar:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }

  .ayuda-nem-cuerpo {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 18px 4px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .ayuda-nem-etiqueta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0 0 7px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: #475569;
  }

  /* Bloque 1 · fondo azul muy suave */
  .ayuda-nem-bloque--proposito {
    padding: 12px 14px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 12px;
  }
  /* Bloque 2 · instrucciones */
  .ayuda-nem-bloque--como { padding: 0 2px; }
  /* Bloque 3 · ejemplo contextual en cursiva destacada */
  .ayuda-nem-bloque--ejemplo {
    padding: 12px 14px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
  }

  #modalAyudaProposito,
  #modalAyudaComoLlenar {
    margin: 0;
    font-size: 13px;
    line-height: 1.6;
    color: #334155;
  }
  #modalAyudaComoLlenar ol,
  #modalAyudaComoLlenar ul { margin: 6px 0 0; padding-left: 20px; }
  #modalAyudaComoLlenar li { margin: 0 0 5px; }
  #modalAyudaEjemplo {
    margin: 0;
    font-family: Georgia, 'Palatino Linotype', serif;
    font-size: 13.5px;
    font-style: italic;
    line-height: 1.6;
    color: #0f172a;
  }

  .ayuda-nem-pie {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 12px 18px 15px;
    border-top: 1px solid var(--app-border);
    background: #ffffff;
    flex: 0 0 auto;
  }
  .ayuda-nem-entendido {
    padding: 9px 18px;
    border: 0;
    border-radius: 8px;
    background: #2563eb;
    color: #ffffff;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s ease;
  }
  .ayuda-nem-entendido:hover { background: #1d4ed8; }
  .ayuda-nem-entendido:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }

  /* ---------- 2 · Biblioteca de recursos ---------- */
  #vistaBibliotecaDocente { display: block; }

  .biblio-filtros {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 0 0 16px;
    padding: 10px 12px;
    background: #f8fafc;
    border: 1px solid var(--app-border);
    border-radius: 14px;
  }
  .biblio-buscador {
    position: relative;
    flex: 1 1 240px;
    min-width: 170px;
  }
  .biblio-buscador .biblio-lupa {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    line-height: 1;
    color: #94a3b8;
    pointer-events: none;
  }
  #buscarRecursoBiblioteca {
    width: 100%;
    height: 38px;
    padding: 0 14px 0 34px;
    border: 1px solid var(--app-border);
    border-radius: 999px;
    background: #ffffff;
    font-family: inherit;
    font-size: 12.8px;
    color: var(--app-text);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #buscarRecursoBiblioteca:focus {
    outline: none;
    border-color: #93c5fd;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  .biblio-filtro,
  #filtroAsignaturaRecurso,
  #filtroGradoRecurso,
  #filtroTrimestreRecurso {
    height: 38px;
    padding: 0 14px;
    border: 1px solid var(--app-border);
    border-radius: 999px;
    background: #ffffff;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    color: #334155;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .biblio-filtro:hover,
  #filtroAsignaturaRecurso:hover,
  #filtroGradoRecurso:hover,
  #filtroTrimestreRecurso:hover { border-color: #93c5fd; background: #f8fbff; }
  .biblio-filtro:focus,
  #filtroAsignaturaRecurso:focus,
  #filtroGradoRecurso:focus,
  #filtroTrimestreRecurso:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  .biblio-subir {
    height: 38px;
    padding: 0 16px;
    border: 0;
    border-radius: 999px;
    background: #2563eb;
    color: #ffffff;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.28);
    transition: background .15s ease, transform .12s ease, box-shadow .15s ease;
  }
  .biblio-subir:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(37, 99, 235, 0.34);
  }
  .biblio-subir:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }

  /* Libros SEP oficiales */
  #gridLibrosOficialesSEP {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    margin: 0 0 18px;
  }
  #gridLibrosOficialesSEP .libro-sep {
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 10px;
    background: #ffffff;
    border: 1px solid var(--app-border);
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    text-align: center;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  #gridLibrosOficialesSEP .libro-sep:hover {
    transform: translateY(-2px);
    border-color: #bfdbfe;
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  }
  #gridLibrosOficialesSEP .libro-sep img {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    border-radius: 8px;
    background: #e2e8f0;
  }
  #gridLibrosOficialesSEP .libro-sep__grado {
    align-self: center;
    padding: 2px 8px;
    border-radius: 999px;
    background: #eff6ff;
    color: #1d4ed8;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  #gridLibrosOficialesSEP .libro-sep__btn {
    padding: 6px 8px;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    background: #f8fbff;
    color: #1d4ed8;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  #gridLibrosOficialesSEP .libro-sep__btn:hover { background: #eff6ff; border-color: #93c5fd; }

  /* Repositorio colectivo */
  .biblio-grid,
  .repositorio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(236px, 1fr));
    gap: 14px;
  }
  .card-recurso {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px;
    background: #ffffff;
    border: 1px solid var(--app-border);
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card-recurso:hover {
    transform: translateY(-2px);
    border-color: #bfdbfe;
    box-shadow: 0 10px 22px rgba(15, 23, 42, 0.09);
  }
  .card-recurso__tipo {
    align-self: flex-start;
    padding: 3px 9px;
    border-radius: 999px;
    background: #e0f2fe;
    color: #0369a1;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .03em;
  }
  .card-recurso__tipo--pdf { background: #fee2e2; color: #b91c1c; }
  .card-recurso__tipo--presentacion { background: #ffedd5; color: #c2410c; }
  .card-recurso__tipo--enlace { background: #dbeafe; color: #1d4ed8; }
  .card-recurso__tipo--video { background: #ede9fe; color: #6d28d9; }
  .card-recurso__titulo {
    margin: 0;
    font-size: 13.5px;
    font-weight: 700;
    line-height: 1.35;
    color: #0f172a;
  }
  .card-recurso__meta {
    font-size: 11.5px;
    line-height: 1.45;
    color: #64748b;
  }
  .card-recurso__acciones {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: auto;
    padding-top: 4px;
  }
  .biblio-vacio {
    grid-column: 1 / -1;
    padding: 36px 20px;
    text-align: center;
    border: 1px dashed #cbd5e1;
    border-radius: 14px;
    background: #f8fafc;
    font-size: 13px;
    line-height: 1.55;
    color: #64748b;
  }

  /* ---------- 3 · Tecnología CECSE ---------- */
  .badge-cecse {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 11px;
    border: 1px solid #bae6fd;
    border-radius: 999px;
    background: #e0f2fe;
    color: #0284c7;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .panel-cecse {
    padding: 14px 16px;
    background: #ffffff;
    border: 1px solid var(--app-border);
    border-left: 4px solid #0284c7;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    margin: 0 0 14px;
  }
  .cecse-horas {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 10px 0 14px;
  }
  .cecse-horas__item {
    flex: 1 1 150px;
    padding: 10px 12px;
    border: 1px solid #e0f2fe;
    border-radius: 10px;
    background: #f0f9ff;
  }
  .cecse-horas__n {
    display: block;
    font-size: 18px;
    font-weight: 800;
    line-height: 1.1;
    color: #0284c7;
  }
  .cecse-horas__l {
    display: block;
    margin-top: 2px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: #0369a1;
  }
  .cecse-software-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px;
  }
  .cecse-software {
    padding: 12px;
    border: 1px solid var(--app-border);
    border-radius: 12px;
    background: #ffffff;
  }
  .cecse-software__grado {
    display: block;
    margin: 0 0 6px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: #64748b;
  }
  .cecse-software__badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 8px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1d4ed8;
    font-size: 11.5px;
    font-weight: 700;
  }
  .cecse-software__badge--excel { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
  .cecse-software__badge--powerpoint { background: #fff7ed; border-color: #fed7aa; color: #c2410c; }

  /* ---------- 4 · Vista previa del alumno ---------- */
  #modalPreviewAlumno {
    position: fixed;
    inset: 0;
    z-index: 99980;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(15, 23, 42, 0.6);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s ease;
  }
  #modalPreviewAlumno.visible,
  #modalPreviewAlumno.abierto { opacity: 1; pointer-events: auto; }

  #modalPreviewAlumno .preview-panel {
    width: min(940px, 96vw);
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 26px 64px rgba(15, 23, 42, 0.34);
    transform: translateY(10px) scale(.99);
    transition: transform .18s cubic-bezier(.2, .8, .2, 1);
  }
  #modalPreviewAlumno.visible .preview-panel,
  #modalPreviewAlumno.abierto .preview-panel { transform: none; }

  .preview-cabecera {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 18px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #ffffff;
    flex: 0 0 auto;
  }
  .preview-cabecera h3 {
    margin: 0;
    font-size: 14.5px;
    font-weight: 800;
    color: #ffffff;
  }
  .preview-cerrar {
    margin-left: auto;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .preview-cerrar:hover { background: rgba(255, 255, 255, 0.24); }
  .preview-cerrar:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }

  .preview-marco {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    margin: 16px;
    border: 1px solid var(--app-border);
    border-radius: 14px;
    overflow: hidden;
    background: #ffffff;
  }
  .preview-barra {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: #eef2f7;
    border-bottom: 1px solid #dbe3ec;
    flex: 0 0 auto;
  }
  .preview-punto {
    width: 9px;
    height: 9px;
    min-width: 9px;
    border-radius: 50%;
    background: #f87171;
  }
  .preview-punto:nth-child(2) { background: #fbbf24; }
  .preview-punto:nth-child(3) { background: #34d399; }
  .preview-url {
    flex: 1 1 auto;
    height: 24px;
    margin-left: 8px;
    padding: 0 10px;
    display: flex;
    align-items: center;
    border: 1px solid #dbe3ec;
    border-radius: 999px;
    background: #ffffff;
    font-size: 11px;
    color: #64748b;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .preview-lienzo {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    padding: 22px;
    background: #ffffff;
    font-size: 14px;
    line-height: 1.6;
    color: var(--app-text);
  }
  .preview-acciones {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 0 16px 16px;
    flex: 0 0 auto;
  }

  /* ---------- 5 · Iframe embebido con carga y fallback ---------- */
  .bloque-iframe-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    margin: 12px 0;
    border: 1px solid var(--app-border);
    border-radius: 14px;
    overflow: hidden;
    background: #0f172a;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  }
  .bloque-iframe-container > iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .iframe-cargando {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #0f172a;
    color: #cbd5e1;
    font-size: 12px;
    font-weight: 600;
    transition: opacity .25s ease;
  }
  .bloque-iframe-container.cargado .iframe-cargando { opacity: 0; pointer-events: none; }
  .iframe-spinner {
    width: 26px;
    height: 26px;
    border: 3px solid rgba(255, 255, 255, 0.18);
    border-top-color: #38bdf8;
    border-radius: 50%;
    animation: iframeSpin .9s linear infinite;
  }
  @keyframes iframeSpin { to { transform: rotate(360deg); } }
  .iframe-fallback {
    position: absolute;
    inset: auto 0 0 0;
    z-index: 2;
    display: none;
    padding: 10px 14px;
    background: rgba(220, 38, 38, 0.92);
    color: #ffffff;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
  }
  .bloque-iframe-container.error .iframe-fallback { display: block; }
  .bloque-iframe-container.error .iframe-cargando { opacity: 0; pointer-events: none; }
  .bloque-iframe-container .iframe-abrir {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 3;
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.74);
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    text-decoration: none;
    opacity: 0;
    transition: opacity .15s ease, background .15s ease;
  }
  .bloque-iframe-container:hover .iframe-abrir,
  .bloque-iframe-container:focus-within .iframe-abrir { opacity: 1; }
  .bloque-iframe-container .iframe-abrir:hover { background: rgba(37, 99, 235, 0.92); }
  .bloque-iframe-container .iframe-abrir:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 2px;
    opacity: 1;
  }
  @supports not (aspect-ratio: 1 / 1) {
    .bloque-iframe-container { height: 0; padding-top: 56.25%; }
  }

  /* ---------- 6 · Línea del tiempo del proyecto NEM ---------- */
  #timelineProyectoNEM {
    display: flex;
    align-items: flex-start;
    gap: 0;
    width: 100%;
    overflow-x: auto;
    padding: 8px 2px 16px;
    margin: 0 0 8px;
  }
  .timeline-paso {
    position: relative;
    flex: 1 1 0;
    min-width: 118px;
    padding: 0 4px;
    text-align: center;
  }
  .timeline-paso::before {
    content: '';
    position: absolute;
    top: 14px;
    left: calc(-50% + 16px);
    right: calc(50% + 16px);
    height: 2px;
    background: #e2e8f0;
  }
  .timeline-paso:first-child::before { display: none; }
  .timeline-paso__punto {
    position: relative;
    width: 30px;
    height: 30px;
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #e2e8f0;
    border-radius: 999px;
    background: #f1f5f9;
    color: #94a3b8;
    font-size: 12px;
    font-weight: 800;
    line-height: 1;
  }
  .timeline-paso__titulo {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    line-height: 1.3;
    color: #64748b;
  }
  .timeline-paso__sub {
    display: block;
    margin-top: 2px;
    font-size: 10px;
    font-weight: 600;
    color: #94a3b8;
  }

  /* Estado: completado */
  .timeline-paso.completado .timeline-paso__punto {
    background: #dcfce7;
    border-color: #86efac;
    color: #15803d;
  }
  .timeline-paso.completado .timeline-paso__titulo { color: #15803d; }
  .timeline-paso.completado::before { background: #86efac; }

  /* Estado: activo (pulso) */
  .timeline-paso.activo .timeline-paso__punto {
    background: #2563eb;
    border-color: #2563eb;
    color: #ffffff;
    animation: timelinePulso 2.2s ease-in-out infinite;
  }
  .timeline-paso.activo .timeline-paso__titulo { color: #1d4ed8; font-weight: 800; }
  @keyframes timelinePulso {
    0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.45); }
    50%      { box-shadow: 0 0 0 7px rgba(37, 99, 235, 0); }
  }

  /* Estado: pendiente */
  .timeline-paso.pendiente .timeline-paso__punto {
    background: #f1f5f9;
    border-color: #e2e8f0;
    color: #94a3b8;
  }
  .timeline-paso.pendiente .timeline-paso__titulo { color: #94a3b8; }

  @media (prefers-reduced-motion: reduce) {
    .timeline-paso.activo .timeline-paso__punto { animation: none; }
    .iframe-spinner { animation: none; }
  }

  @media (max-width: 640px) {
    .bloque-iframe-container { aspect-ratio: 4 / 3; border-radius: 10px; }
    .biblio-grid,
    .repositorio-grid { grid-template-columns: 1fr; }
    .preview-marco { margin: 10px; }
    .preview-lienzo { padding: 14px; }
    #timelineProyectoNEM .timeline-paso { min-width: 104px; }
  }
  /* ============================================================
     DESATURACIÓN VISUAL UI/UX — ETAPA 1 & 2  (DeepSeek)
     Banner editorial sin cajitas · rejilla 2×2 · micro-iconos limpios ·
     Stepper con check y barra de progreso · tarjetas de contenidos.
     Reglas: sin declaraciones forzadas, sin cambios de ID, solo presentación.
     ============================================================ */

  /* ---------- 1 · Banner de clase: cinta editorial plana ---------- */
  .nem-banner {
    background: #f8fafc;
    border: 1px solid #eef2f7;
    border-radius: 10px;
    box-shadow: none;
    padding: 10px 16px;
  }
  .nem-banner .nem-banner-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0;
    border: 0;
    background: transparent;
    border-radius: 0;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .12em;
    color: #0e7490;
  }
  .nem-banner .nem-banner-tag::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #0ea5e9;
    flex: 0 0 auto;
  }
  .nem-banner .nem-banner-title {
    color: #0f172a;
    font-size: 17px;
    letter-spacing: -.01em;
  }
  .nem-banner .nem-banner-meta {
    gap: 0;
    justify-content: flex-start;
    overflow: visible;
  }
  .nem-banner .nem-banner-meta span {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    font-size: 12.5px;
    font-weight: 600;
    color: #475569;
  }
  .nem-banner .nem-banner-meta span + span::before {
    content: '•';
    margin: 0 10px;
    color: #cbd5e1;
    font-weight: 700;
  }
  .nem-banner .nem-banner-meta strong {
    color: #0f172a;
    font-weight: 700;
  }
  .nem-banner .nem-banner-btn {
    border-width: 1px;
    box-shadow: none;
    background: transparent;
    padding: 6px 12px;
    font-size: 12px;
  }
  .nem-banner .nem-banner-btn:hover {
    background: #0284c7;
    color: #ffffff;
  }

  /* ---------- 2 · Etapa 1: rejilla respirable 2×2 ---------- */
  .nem-fila-una {
    display: grid;
    grid-template-columns: minmax(220px, 2.2fr) minmax(160px, 1.35fr) minmax(160px, 1.35fr) 128px;
    gap: 12px;
    align-items: end;
    margin-bottom: 20px;
  }
  .nem-fila-una > .nem-campo-titulo,
  .nem-fila-una > .nem-campo-formativo,
  .nem-fila-una > .nem-campo-metodologia,
  .nem-fila-una > .nem-campo-sesiones {
    grid-column: span 1;
    min-width: 0;
  }

  @media (max-width: 980px) {
    .nem-fila-una { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .nem-fila-una > .nem-campo-titulo,
    .nem-fila-una > .nem-campo-formativo,
    .nem-fila-una > .nem-campo-metodologia,
    .nem-fila-una > .nem-campo-sesiones { grid-column: span 1; }
  }
  @media (max-width: 620px) {
    .nem-fila-una { grid-template-columns: 1fr; }
    .nem-fila-una > .nem-campo-titulo,
    .nem-fila-una > .nem-campo-sesiones,
    .nem-fila-una > .nem-campo-formativo,
    .nem-fila-una > .nem-campo-metodologia { grid-column: span 1; }
  }

  /* La acción de IA se alinea a la derecha del label, sin empujar el campo */
  .nem-campo-inline > label {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .nem-campo-inline > label .btn-ia-sugerir-titulo { margin-left: auto; }

  /* ---------- 3 · Micro-iconos: fuera el ruido ---------- */
  /* La bocina solo vive dentro del modal de ayuda y del drawer */
  label .btn-voz-nem { display: none; }
  #modalAyudaNEM .btn-voz-nem,
  #drawerAsistenteIA .btn-voz-nem { display: inline-flex; }

  /* Nada de ❓ ni ✨ dentro de las pestañas del Stepper */
  .nem-step-tab .nem-ayuda-paso { display: none; }

  /* ---------- 4 · Stepper: check y barra de progreso ---------- */
  .nem-stepper-header {
    position: relative;
    overflow: hidden;
    padding-bottom: 9px;
  }
  .nem-stepper-header::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 25%;
    border-radius: 0 3px 3px 0;
    background: linear-gradient(90deg, #2563eb 0%, #10b981 100%);
    transition: width .35s ease;
  }
  .nem-stepper-header:has(#tabPasoPlan2.activo)::after { width: 50%; }
  .nem-stepper-header:has(#tabPasoPlan3.activo)::after { width: 75%; }
  .nem-stepper-header:has(#tabPasoPlan4.activo)::after { width: 100%; }

  .nem-step-tab {
    border: 1px solid transparent;
    transition: background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .nem-step-tab.completado .step-num {
    background: #10b981;
    color: #ffffff;
    font-size: 0;
  }
  .nem-step-tab.completado .step-num::after {
    content: '✓';
    font-size: 13px;
    font-weight: 800;
    line-height: 1;
  }
  .nem-step-tab.completado {
    box-shadow: inset 0 -2px 0 #10b981;
  }
  .nem-step-tab.completado .step-txt { color: #047857; }

  /* ---------- 5 · Etapa 2: rejilla y tarjetas de contenidos ---------- */
  .grid-contenidos-nem {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(238px, 1fr));
    gap: 12px;
    margin: 10px 0 16px;
  }
  .card-contenido-nem {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card-contenido-nem:hover {
    transform: translateY(-2px);
    border-color: #cbd5e1;
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.10);
  }
  .card-contenido-nem.seleccionado {
    padding: 13px;
    border: 2px solid #2563eb;
    background: #eff6ff;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.16);
  }
  .card-contenido-nem__titulo {
    margin: 0;
    font-size: 13.5px;
    font-weight: 700;
    line-height: 1.35;
    color: #0f172a;
  }
  .card-contenido-nem__texto {
    font-size: 12.5px;
    line-height: 1.45;
    color: #475569;
  }
  .card-contenido-nem__meta {
    font-size: 11px;
    font-weight: 600;
    color: #64748b;
  }

  /* ---------- 6 · Paleta oficial por Campo Formativo ---------- */
  .badge-campo {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    align-self: flex-start;
    padding: 2px 9px;
    border: 1px solid transparent;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .03em;
    text-transform: uppercase;
  }
  .badge-campo--lenguajes {
    color: #1e40af;
    background: #eff6ff;
    border-color: #bfdbfe;
  }
  .badge-campo--cientifico {
    color: #6d28d9;
    background: #f5f3ff;
    border-color: #ddd6fe;
  }
  .badge-campo--etica {
    color: #c2410c;
    background: #fff7ed;
    border-color: #fed7aa;
  }
  .badge-campo--comunitario {
    color: #047857;
    background: #ecfdf5;
    border-color: #a7f3d0;
  }

  /* Acento de la tarjeta según el campo */
  .card-contenido-nem--lenguajes { border-left: 4px solid #1e40af; }
  .card-contenido-nem--cientifico { border-left: 4px solid #6d28d9; }
  .card-contenido-nem--etica { border-left: 4px solid #c2410c; }
  .card-contenido-nem--comunitario { border-left: 4px solid #047857; }

  /* ---------- 7 · Filas de PDA legibles (contraste AAA) ---------- */

  .pda-item {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin: 0 0 6px;
    padding: 8px 10px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: #f8fafc;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .pda-item:hover {
    background: #f1f5f9;
    border-color: #cbd5e1;
  }
  .pda-item input[type="checkbox"] {
    width: 16px;
    height: 16px;
    min-width: 16px;
    margin: 2px 0 0;
    accent-color: #2563eb;
    cursor: pointer;
  }
  .pda-item__texto {
    font-size: 13.5px;
    line-height: 1.45;
    color: #1e293b;
  }
  .pda-item:has(input:checked) {
    background: #eff6ff;
    border-color: #bfdbfe;
  }
  .pda-item:has(input:checked) .pda-item__texto {
    color: #0f172a;
    font-weight: 600;
  }

  @media (prefers-reduced-motion: reduce) {
    .nem-step-tab,
    .card-contenido-nem,
    .pda-item,
    .nem-stepper-header::after { transition: none; }
    .card-contenido-nem:hover { transform: none; }
  }
  /* ============================================================
     OLA 1 · ETAPA 4 — LISTA DE COTEJO / RÚBRICA EDITABLE
     Contrato: #cajaRubricaCotejoNEM, .nem-tabla-cotejo-edit,
     .input-criterio-cotejo-nem, .btn-quitar-criterio-nem
     ============================================================ */
  #cajaRubricaCotejoNEM {
    margin: 14px 0 4px;
    padding: 12px 14px 10px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
  }
  .nem-rubrica-cab {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 0 10px;
    margin: 0 0 8px;
    border-bottom: 1px solid #eef2f7;
  }
  .nem-rubrica-titulo {
    margin: 0;
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: .01em;
    color: #0f172a;
  }
  .nem-rubrica-contador {
    display: inline-flex;
    align-items: center;
    padding: 2px 9px;
    border: 1px solid #bae6fd;
    border-radius: 999px;
    background: #f0f9ff;
    color: #0369a1;
    font-size: 10.5px;
    font-weight: 800;
    white-space: nowrap;
  }
  .nem-rubrica-acciones {
    display: flex;
    gap: 6px;
    margin-left: auto;
    flex-wrap: wrap;
  }
  .nem-rubrica-btn {
    padding: 5px 11px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: #ffffff;
    color: #334155;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
  }
  .nem-rubrica-btn:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
    color: #0f172a;
  }
  .nem-rubrica-btn:focus-visible {
    outline: 2px solid #0284c7;
    outline-offset: 2px;
  }
  .nem-rubrica-btn--ia {
    border-color: #ddd6fe;
    background: #f5f3ff;
    color: #6d28d9;
  }
  .nem-rubrica-btn--ia:hover {
    background: #ede9fe;
    border-color: #c4b5fd;
    color: #5b21b6;
  }

  /* ---- Tabla editable ---- */
  .nem-tabla-cotejo-edit {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 12.5px;
  }
  .nem-tabla-cotejo-edit thead th {
    padding: 6px 8px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: #64748b;
    text-align: left;
    white-space: nowrap;
  }
  .nem-tabla-cotejo-edit thead th.col-indicador {
    width: 76px;
    text-align: center;
  }
  .nem-tabla-cotejo-edit thead th.col-quitar { width: 34px; }
  .nem-tabla-cotejo-edit tbody td {
    padding: 4px 8px;
    border-bottom: 1px solid #f1f5f9;
    vertical-align: middle;
  }
  .nem-tabla-cotejo-edit tbody tr:last-child td { border-bottom: 0; }
  .nem-tabla-cotejo-edit tbody tr:hover td { background: #fbfcfe; }
  .nem-tabla-cotejo-edit td.col-indicador { text-align: center; }

  /* Input del criterio: sin borde hasta el foco */
  .input-criterio-cotejo-nem {
    width: 100%;
    min-width: 0;
    padding: 6px 8px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    font-family: inherit;
    font-size: 12.5px;
    line-height: 1.4;
    color: #1e293b;
    transition: border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
  }
  .input-criterio-cotejo-nem:hover {
    background: #f8fafc;
    border-color: #e2e8f0;
  }
  .input-criterio-cotejo-nem:focus {
    outline: none;
    border-color: #0284c7;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.14);
